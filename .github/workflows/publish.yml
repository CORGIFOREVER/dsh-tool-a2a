# Publish to npm from GitHub Actions.
# Auth: an npm Granular Access Token (Publish, bypass-2FA) stored in the NPM_TOKEN
# repository secret. `--provenance` adds an OIDC-signed provenance attestation
# (id-token: write) on top of the token authentication.
#
# Trigger: push a version tag, e.g.
#   git tag v0.1.2 && git push origin v0.1.2
# (package.json version should match the tag, minus the leading "v")

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for npm provenance attestations
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "error: tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
