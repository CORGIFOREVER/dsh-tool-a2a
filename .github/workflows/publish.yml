# Publish to npm via GitHub OIDC trusted publishing (provenance).
# No npm token, no OTP: the npm registry verifies the GitHub OIDC identity token
# against this repository (package.json `repository` field must match).
#
# Trigger: push a version tag, e.g.
#   git tag v0.1.1 && git push origin v0.1.1
# (package.json version should match the tag, minus the leading "v")

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm provenance / OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "error: tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish to npm (provenance)
        run: npm publish --provenance --access public
